name: Official NASA empirical rebuild
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/empirical-rebuild.yml"
      - "research/**"
      - "scripts/fetch_and_analyze.py"
      - "data/derived/**"
      - "data/source_manifest.json"
      - "results/**"
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_and_analyze.py --check
