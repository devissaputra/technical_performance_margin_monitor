<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Evidence boundary and released findings</text><rect x="55" y="100" width="1090" height="96" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="73" y="131" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">Design correction</text><text x="73" y="157" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Fixed 40 / 60 / 80 checkpoints remove dependence on each cell's eventual recorded lifetime.</text><rect x="55" y="220" width="1090" height="96" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="73" y="251" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">Aggregate finding</text><text x="73" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">MAE across crossing cells falls 102.399 → 35.852 → 11.942 cycles as checkpoint evidence accumulates.</text><rect x="55" y="340" width="1090" height="96" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="73" y="371" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#9a3412">Heterogeneity warning</text><text x="73" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">B0006 gets less accurate across checkpoints even while the aggregate improves; B0005 drives much of the early MAE.</text><rect x="55" y="460" width="1090" height="96" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="73" y="491" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">False warning and claim limit</text><text x="73" y="517" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">B0007 projects 158.219 at cycle 80 but never crosses 1.4 Ah through 168. Four-cell baseline only; no calibrated uncertainty or production BMS claim.</text><text x="55" y="625" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Interpretation: forecast revision and cell-level behavior should accompany a point estimate of margin exhaustion.</text></svg>