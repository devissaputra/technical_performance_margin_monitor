<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="100%" height="100%" fill="white"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Evidence boundary</text><rect x="55" y="90" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="117" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">What improves</text><text x="80" y="141" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Fixed checkpoints remove dependence on eventual recorded lifetime.</text><rect x="55" y="182" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="209" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">What remains hard</text><text x="80" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Individual linear forecasts can still revise by tens or hundreds of cycles.</text><rect x="55" y="274" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="301" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Concrete warning</text><text x="80" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">B0007 projects 158.2 cycles at checkpoint 80 but stays above 1.4 Ah through cycle 168.</text><rect x="55" y="366" width="1090" height="68" rx="10" fill="#f8f8f8" stroke="#444"/><text x="80" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Claim limit</text><text x="80" y="417" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Transparent baseline on four lab cells; not production BMS or general RUL validation.</text></svg>