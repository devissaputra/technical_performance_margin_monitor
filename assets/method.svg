<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="#ffffff"/><text x="55" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Fixed checkpoint performance margin forecasting pipeline</text><text x="55" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#475569">The forecast at each checkpoint sees only evidence available up to that cycle; later observations are reserved for evaluation.</text><rect x="45" y="135" width="210" height="125" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="63" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1d4ed8">1 • NASA evidence</text><text x="63" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">B0005 / B0006</text><text x="63" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">B0007 / B0018</text><text x="63" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">636 discharge cycles</text><rect x="295" y="135" width="210" height="125" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="313" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#6d28d9">2 • Censor at checkpoint</text><text x="313" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Cycle 40</text><text x="313" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Cycle 60</text><text x="313" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Cycle 80</text><rect x="545" y="135" width="210" height="125" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="563" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#15803d">3 • Current margin</text><text x="563" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Capacity - 1.4 Ah</text><text x="563" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">State at decision time</text><rect x="795" y="135" width="210" height="125" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="813" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#92400e">4 • OLS trend</text><text x="813" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Fit available history</text><text x="813" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">No future observations</text><line x1="255" y1="198" x2="283" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="283,192 295,198 283,204" fill="#64748b"/><line x1="505" y1="198" x2="533" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="533,192 545,198 533,204" fill="#64748b"/><line x1="755" y1="198" x2="783" y2="198" stroke="#64748b" stroke-width="2"/><polygon points="783,192 795,198 783,204" fill="#64748b"/><rect x="795" y="330" width="210" height="135" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="813" y="361" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#9a3412">5 • Project boundary</text><text x="813" y="387" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Solve fitted line</text><text x="813" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">for capacity = 1.4 Ah</text><text x="813" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Point forecast only</text><line x1="900" y1="260" x2="888" y2="330" stroke="#f97316" stroke-width="2"/><polygon points="888,324 900,330 888,336" fill="#f97316"/><rect x="520" y="330" width="225" height="135" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="538" y="361" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#991b1b">6 • Compare later outcome</text><text x="538" y="387" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Observed crossing</text><text x="538" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">or no crossing horizon</text><text x="538" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Signed + absolute error</text><line x1="795" y1="397" x2="733" y2="397" stroke="#ef4444" stroke-width="2"/><polygon points="733,391 745,397 733,403" fill="#ef4444"/><rect x="235" y="330" width="235" height="135" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="253" y="361" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#4338ca">7 • Forecast maturity</text><text x="253" y="387" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Revision from prior</text><text x="253" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">checkpoint projection</text><text x="253" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Track stability</text><line x1="520" y1="397" x2="458" y2="397" stroke="#6366f1" stroke-width="2"/><polygon points="458,391 470,397 458,403" fill="#6366f1"/><rect x="235" y="530" width="770" height="115" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="253" y="561" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#334155">8 • Decision evidence</text><text x="253" y="587" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Current margin + projected crossing + revision history + realized error / warning status</text><text x="253" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#475569">Interpret aggregate trends together with cell-level heterogeneity</text><line x1="352" y1="465" x2="340" y2="530" stroke="#6366f1" stroke-width="2"/><polygon points="340,524 352,530 340,536" fill="#6366f1"/><line x1="632" y1="465" x2="620" y2="530" stroke="#ef4444" stroke-width="2"/><polygon points="620,524 632,530 620,536" fill="#ef4444"/><line x1="900" y1="465" x2="888" y2="530" stroke="#f97316" stroke-width="2"/><polygon points="888,524 900,530 888,536" fill="#f97316"/><text x="55" y="695" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#334155">Key safeguard: checkpoints are fixed in advance and never depend on each battery's eventual lifetime or crossing cycle.</text></svg>