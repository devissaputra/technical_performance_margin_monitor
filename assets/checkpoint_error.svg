rial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">Cycle 60</text><line x1="920" y1="130" x2="920" y2="570" stroke="#f1f5f9" stroke-width="1"/><text x="920" y="602" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">Cycle 80</text><polyline points="280,189.34 600,244.08 920,316.83" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="189.33728681777637" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="292" y="179.33728681777637" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2563eb">288.782</text><circle cx="600" cy="244.0784591474586" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="612" y="234.0784591474586" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2563eb">91.817</text><circle cx="920" cy="316.82702227680977" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="932" y="306.82702227680977" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2563eb">20.025</text><polyline points="280,510.70 600,374.20 920,328.86" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="510.7016291327946" r="7" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="292" y="500.7016291327946" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#7c3aed">0.346</text><circle cx="600" cy="374.20472436284035" r="7" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="612" y="364.20472436284035" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#7c3aed">6.025</text><circle cx="920" cy="328.86052712759727" r="7" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="932" y="318.86052712759727" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#7c3aed">15.566</text><polyline points="280,321.74 600,351.38 920,528.98" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="321.7372470320733" r="7" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="292" y="311.7372470320733" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#16a34a">18.069</text><circle cx="600" cy="351.3812914570618" r="7" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="612" y="341.3812914570618" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#16a34a">9.715</text><circle cx="920" cy="528.9796796732883" r="7" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="932" y="518.9796796732883" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#16a34a">0.236</text><line x1="105" y1="570" x2="1135" y2="570" stroke="#334155" stroke-width="1.7"/><line x1="105" y1="130" x2="105" y2="570" stroke="#334155" stroke-width="1.7"/><text x="28" y="350" transform="rotate(-90 28 350)" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#172033">Absolute threshold-cycle error (log scale)</text><rect x="810" y="105" width="325" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><line x1="835" y1="135" x2="870" y2="135" stroke="#2563eb" stroke-width="4"/><text x="880" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#172033">B0005</text><line x1="930" y1="135" x2="965" y2="135" stroke="#7c3aed" stroke-width="4"/><text x="975" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#172033">B0006</text><line x1="1025" y1="135" x2="1060" y2="135" stroke="#16a34a" stroke-width="4"/><text x="1070" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#172033">B0018</text><text x="835" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#475569">B0006 is the key counterexample:</text><text x="835" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#7c3aed">0.346 → 6.025 → 15.566 cycles</text><text x="55" y="666" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">Aggregate MAE improves, but later checkpoints do not improve every battery. B0007 is excluded because no observed 1.4 Ah crossing occurs.</text></svg>